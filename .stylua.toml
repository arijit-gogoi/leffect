# Parse as Lua 5.1 so formatting fails on syntax outside the LuaJIT/5.4
# common subset (goto, //, bitwise operators, <close>, ...).
syntax = "Lua51"
column_width = 100
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
